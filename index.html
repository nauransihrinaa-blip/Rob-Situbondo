<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        #map {
            width: 836px;
            height: 700px;
        }
        </style>
        <title>Kerentanan Banjir Kab. Situbondo</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/Mapbiomass_Situbondo_1.js"></script>
        <script src="data/KerentananBanjirKabupatenSitubondo_2.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-8.243379144112941,113.52310782317171],[-7.396685542596393,114.53502080274221]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var title = new L.Control({'position':'topright'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>Kerentanan Banjir Kab. Situbondo</h2>';
        };
        title.addTo(map);
        var abstract = new L.Control({'position':'bottomright'});
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div',
            'leaflet-control abstract');
            this._div.id = 'abstract'
                this._div.setAttribute("onmouseenter", "abstract.show()");
                this._div.setAttribute("onmouseleave", "abstract.hide()");
                this.hide();
                return this._div;
            };
            abstract.hide = function () {
                this._div.classList.remove("abstractUncollapsed");
                this._div.classList.add("abstract");
                this._div.innerHTML = 'i'
            }
            abstract.show = function () {
                this._div.classList.remove("abstract");
                this._div.classList.add("abstractUncollapsed");
                this._div.innerHTML = 'Kabupaten Situbondo merupakan wilayah di pesisir utara Jawa Timur yang memiliki karakteristik topografi dan penggunaan lahan yang beragam dari kawasan pesisir dan dataran rendah hingga wilayah dengan elevasi yang lebih tinggi di bagian selatan. Kondisi tersebut, ditambah dengan variasi curah hujan, kemiringan lereng, jenis tanah, serta pola penggunaan lahan, dapat memengaruhi tingkat kerentanan wilayah terhadap banjir. Pemetaan kerentanan banjir dilakukan menggunakan pendekatan Sistem Informasi Geografis (SIG) untuk mengidentifikasi dan memvisualisasikan persebaran tingkat kerentanan secara spasial. Parameter yang digunakan meliputi elevasi, kemiringan lereng, curah hujan, jenis tanah, dan penggunaan lahan. Setiap parameter diklasifikasikan dan diberikan skor berdasarkan pengaruhnya terhadap kerentanan banjir, kemudian diintegrasikan menggunakan metode weighted overlay. Hasil analisis menghasilkan peta yang mengelompokkan wilayah Kabupaten Situbondo ke dalam tingkat kerentanan rendah, sedang, dan tinggi. Hasil pemetaan diharapkan dapat memberikan gambaran spasial mengenai pola kerentanan banjir di Kabupaten Situbondo serta menjadi informasi pendukung dalam pengelolaan risiko dan perencanaan wilayah berbasis kondisi lingkungan.';
        };
        abstract.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GoogleSatellite_0');
        map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;
        var layer_GoogleSatellite_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_0',
            opacity: 1.0,
            attribution: '<a href="https://www.google.at/permissions/geoguidelines/attr-guide.html">Map data ©2015 Google</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_GoogleSatellite_0;
        map.addLayer(layer_GoogleSatellite_0);
        function pop_Mapbiomass_Situbondo_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fid'] !== null ? autolinker.link(String(feature.properties['fid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['gridcode'] !== null ? autolinker.link(String(feature.properties['gridcode']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['class_id'] !== null ? autolinker.link(String(feature.properties['class_id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['class_en'] !== null ? autolinker.link(String(feature.properties['class_en']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">class_id_b</th>\
                        <td class="visible-with-data" id="class_id_b">' + (feature.properties['class_id_b'] !== null ? autolinker.link(String(feature.properties['class_id_b']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['lv1_en'] !== null ? autolinker.link(String(feature.properties['lv1_en']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['lv1_id'] !== null ? autolinker.link(String(feature.properties['lv1_id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['hex_color'] !== null ? autolinker.link(String(feature.properties['hex_color']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Mapbiomass_Situbondo_1_0(feature) {
            switch(String(feature.properties['gridcode'])) {
                case '40':
                    return {
                pane: 'pane_Mapbiomass_Situbondo_1',
                stroke: false, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(199,21,133,1.0)',
                interactive: true,
            }
                    break;
                case '30':
                    return {
                pane: 'pane_Mapbiomass_Situbondo_1',
                stroke: false, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(156,0,39,1.0)',
                interactive: true,
            }
                    break;
                case '10':
                    return {
                pane: 'pane_Mapbiomass_Situbondo_1',
                stroke: false, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(214,188,116,1.0)',
                interactive: true,
            }
                    break;
                default:
                    return {
                pane: 'pane_Mapbiomass_Situbondo_1',
                stroke: false, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(170,170,170,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_Mapbiomass_Situbondo_1');
        map.getPane('pane_Mapbiomass_Situbondo_1').style.zIndex = 401;
        map.getPane('pane_Mapbiomass_Situbondo_1').style['mix-blend-mode'] = 'normal';
        var layer_Mapbiomass_Situbondo_1 = new L.geoJson(json_Mapbiomass_Situbondo_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Mapbiomass_Situbondo_1',
            layerName: 'layer_Mapbiomass_Situbondo_1',
            pane: 'pane_Mapbiomass_Situbondo_1',
            onEachFeature: pop_Mapbiomass_Situbondo_1,
            style: style_Mapbiomass_Situbondo_1_0,
        });
        bounds_group.addLayer(layer_Mapbiomass_Situbondo_1);
        map.addLayer(layer_Mapbiomass_Situbondo_1);
        function pop_KerentananBanjirKabupatenSitubondo_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fid'] !== null ? autolinker.link(String(feature.properties['fid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['DN'] !== null ? autolinker.link(String(feature.properties['DN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Kategori</th>\
                        <td class="visible-with-data" id="Kategori">' + (feature.properties['Kategori'] !== null ? autolinker.link(String(feature.properties['Kategori']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_KerentananBanjirKabupatenSitubondo_2_0(feature) {
            switch(String(feature.properties['Kategori'])) {
                case 'Rendah':
                    return {
                pane: 'pane_KerentananBanjirKabupatenSitubondo_2',
                opacity: 1,
                color: 'rgba(35,35,35,0.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(106,205,16,1.0)',
                interactive: true,
            }
                    break;
                case 'Sedang':
                    return {
                pane: 'pane_KerentananBanjirKabupatenSitubondo_2',
                opacity: 1,
                color: 'rgba(35,35,35,0.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,227,53,1.0)',
                interactive: true,
            }
                    break;
                case 'Tinggi':
                    return {
                pane: 'pane_KerentananBanjirKabupatenSitubondo_2',
                opacity: 1,
                color: 'rgba(35,35,35,0.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,43,9,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_KerentananBanjirKabupatenSitubondo_2');
        map.getPane('pane_KerentananBanjirKabupatenSitubondo_2').style.zIndex = 402;
        map.getPane('pane_KerentananBanjirKabupatenSitubondo_2').style['mix-blend-mode'] = 'normal';
        var layer_KerentananBanjirKabupatenSitubondo_2 = new L.geoJson(json_KerentananBanjirKabupatenSitubondo_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_KerentananBanjirKabupatenSitubondo_2',
            layerName: 'layer_KerentananBanjirKabupatenSitubondo_2',
            pane: 'pane_KerentananBanjirKabupatenSitubondo_2',
            onEachFeature: pop_KerentananBanjirKabupatenSitubondo_2,
            style: style_KerentananBanjirKabupatenSitubondo_2_0,
        });
        bounds_group.addLayer(layer_KerentananBanjirKabupatenSitubondo_2);
        map.addLayer(layer_KerentananBanjirKabupatenSitubondo_2);
        setBounds();
        </script>
    </body>
</html>
